[project]
name = "meetingos"
version = "0.1.0"
description = "NLP- and deep-learning-powered organizational memory and decision intelligence system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "MeetingOS Team" }]
dependencies = [
    # Core backend & Validation
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Database & ORM
    "sqlalchemy>=2.0.32",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.2",
    "pgvector>=0.3.2",
    # Task Queue & Cache
    "redis>=5.0.8",
    "celery>=5.4.0",
    # Core Utilities
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.6.0",
    "pyright>=1.1.378",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.6.0",
    "pyright>=1.1.378",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/common",
    "packages/ingestion",
    "packages/speech",
    "packages/nlp",
    "packages/memory",
    "packages/retrieval",
    "packages/reasoning",
    "apps/api",
    "workers",
]

# ------------------------------------------------------------------------------
# Tool Configurations: Ruff, Pyright, Pytest
# ------------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "packages", "workers", "tests", "evaluation"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort imports
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # unused arguments
    "PTH", # use pathlib
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function call in argument defaults (standard for FastAPI Depends)
    "B904", # raise exception from None or err (not always required)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["apps", "packages", "workers", "tests", "evaluation"]
exclude = ["**/__pycache__", ".venv", "apps/web"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
